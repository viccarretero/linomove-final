<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todas las Notificaciones - Linomove</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .notification-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .notification-item {
            border-left: 5px solid #3498db;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .notification-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .notification-item.no-leida {
            border-left-color: #f59e0b;
            background: #fffdf5;
        }

        .notification-item.leida {
            border-left-color: #95a5a6;
            background: #f8f9fa;
            opacity: 0.82;
        }

        .notification-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: white;
        }

        .notification-icon.reserva {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .notification-icon.asignacion {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .notification-icon.pago {
            background: linear-gradient(135deg, #27ae60, #219653);
        }

        .notification-icon.finalizado {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
        }

        .notification-icon.estado {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }
        .notification-icon.soporte {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }

        .notification-icon.soporte-proceso {
            background: linear-gradient(135deg, #06b6d4, #0284c7);
        }

        .notification-icon.soporte-resuelto {
            background: linear-gradient(135deg, #16a34a, #15803d);
        }

        .notification-icon.rechazo {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .notification-time {
            font-size: 0.78rem;
            color: #6c757d;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{MBVGComponentes/MBVGheader :: headerPrincipal}"></div>

    <div class="container flex-grow-1">
        <div class="notification-container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="text-primary">
                        <i class="fas fa-bell me-2"></i>Todas mis Notificaciones
                    </h1>
                    <p class="text-muted mb-0">Historial completo de tus notificaciones</p>
                </div>

                <div class="text-end">
                    <span class="badge bg-danger fs-6" th:if="${totalNoLeidas > 0}" th:text="${totalNoLeidas + ' no leídas'}">
                    </span>

                    <span class="badge bg-success fs-6" th:if="${totalNoLeidas == 0}">
                        Sin pendientes
                    </span>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <a th:href="@{/cliente/dashboard}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i>Volver al Dashboard
                </a>

                <form th:action="@{/cliente/notificaciones/leer-todas}" method="post"
                      th:if="${totalNoLeidas > 0}">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check-double me-1"></i>Marcar todas como leídas
                    </button>
                </form>
            </div>

            <div id="listaNotificaciones">
                <div th:if="${#lists.isEmpty(notificaciones)}" class="text-center py-5">
                    <i class="fas fa-bell-slash fa-4x text-muted mb-3"></i>
                    <h3 class="text-muted">No hay notificaciones</h3>
                    <p class="text-muted">No tienes notificaciones en tu historial.</p>
                </div>

                <div th:each="notif : ${notificaciones}" 
                     class="notification-item"
                     th:classappend="${notif.estado == 'enviada' ? 'no-leida' : 'leida'}">

                    <div class="d-flex align-items-start">
                        <div class="notification-icon"
                             th:classappend="${
                                notif.tipo == 'soporte' and notif.titulo == 'Ticket resuelto' ? 'soporte-resuelto' :
                                (notif.tipo == 'soporte' and notif.titulo == 'Ticket en proceso' ? 'soporte-proceso' :
                                (notif.tipo != null ? notif.tipo : 'estado'))
                             }">

                            <i th:class="${
                                notif.tipo == 'reserva' ? 'fas fa-car' :
                                (notif.tipo == 'asignacion' ? 'fas fa-user-check' :
                                (notif.tipo == 'pago' ? 'fas fa-money-check-alt' :
                                (notif.tipo == 'finalizado' ? 'fas fa-flag-checkered' :
                                (notif.tipo == 'rechazo' ? 'fas fa-times-circle' :
                                (notif.tipo == 'soporte' and notif.titulo == 'Ticket resuelto' ? 'fas fa-check-circle' :
                                (notif.tipo == 'soporte' ? 'fas fa-headset' : 'fas fa-bell'))))))
                            }"></i>
                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="mb-0"
                                    th:classappend="${notif.estado == 'enviada' ? 'text-dark fw-bold' : 'text-muted'}"
                                    th:text="${notif.titulo}">
                                </h5>

                                <span th:if="${notif.estado == 'enviada'}" class="badge bg-warning text-dark">
                                    NUEVO
                                </span>
                            </div>

                            <p class="mb-2"
                               th:classappend="${notif.estado == 'enviada' ? 'text-dark' : 'text-muted'}"
                               th:text="${notif.mensaje}">
                            </p>

                            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                                <small class="notification-time">
                                    <i class="fas fa-clock me-1"></i>
                                    <span th:text="${#dates.format(notif.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
                                </small>

                                <form th:if="${notif.estado == 'enviada'}"
                                      th:action="@{/cliente/notificaciones/leer}"
                                      method="post">
                                    <input type="hidden" name="notificacionId" th:value="${notif.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        <i class="fas fa-check me-1"></i>Marcar como leída
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{MBVGComponentes/MBVGfooter :: footerPrincipal}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
