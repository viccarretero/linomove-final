<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Realizar Pago - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .payment-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 0; }
        .payment-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
        .payment-header { background: linear-gradient(135deg, #28a745, #20c997); color: white; border-radius: 15px 15px 0 0; padding: 20px; }
    </style>
</head>
<body class="payment-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="payment-card">
                    <div class="payment-header text-center">
                        <h2><i class="fas fa-check-circle me-2"></i>Confirmar Pago</h2>
                        <p class="mb-0" th:text="${'Traslado #' + reserva.id + ' - ' + reserva.origen + ' → ' + reserva.destino}"></p>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="row mb-4">
                            <div class="col-md-6 border-end">
                                <h5>Detalles del Servicio</h5>
                                <p class="mb-1"><strong>Vehículo:</strong> <span class="badge bg-primary" th:text="${reserva.tipoVehiculo}"></span></p>
                                <p class="mb-1"><strong>Distancia:</strong> <span th:text="${reserva.distanciaKm + ' km'}"></span></p>
                            </div>
                            <div class="col-md-6 text-center">
                                <h1 class="text-success fw-bold" th:text="${'S/ ' + reserva.tarifa}">S/ 0.00</h1>
                                <p class="text-muted">Total a pagar (Inc. IGV)</p>
                            </div>
                        </div>

                        <div class="bg-light p-3 rounded border border-success mb-4">
                            <h6 class="text-success"><i class="fas fa-university me-2"></i>Transferencia Bancaria</h6>
                            <p class="small mb-0">Banco: BCP | Cuenta: 193-23456789-0-15 | CCI: 00219300234567890159</p>
                        </div>

                        <form th:action="@{/cliente/pago/transferencia}" method="post">
                            <input type="hidden" name="reservaId" th:value="${reserva.id}">
                            <input type="hidden" name="monto" th:value="${reserva.tarifa}">
                            
                            <div class="mb-3">
                                <label class="form-label">Número de Operación <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="numeroOperacion" required pattern="[0-9]{6,12}">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Banco Origen <span class="text-danger">*</span></label>
                                <select class="form-select" name="banco" required>
                                    <option value="BCP">BCP</option>
                                    <option value="BBVA">BBVA</option>
                                    <option value="Interbank">Interbank</option>
                                    <option value="Scotiabank">Scotiabank</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg"><i class="fas fa-paper-plane me-2"></i>Confirmar Transferencia</button>
                                <a th:href="@{/cliente/dashboard}" class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
