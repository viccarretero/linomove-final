<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calificar Viaje - LinoMove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: #f4f6f9;
        }

        .rating-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .star-rating {
            font-size: 2.2rem;
            color: #d1d5db;
            cursor: pointer;
        }

        .star-rating .star.active,
        .star-rating .star:hover {
            color: #ffc107;
        }

        .btn-calificar {
            background: linear-gradient(135deg, #28a745, #20c997);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-weight: bold;
        }

        .detalle-card {
            border-left: 5px solid #198754;
            border-radius: 14px;
        }

        .main-card {
            border-radius: 14px;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{MBVGComponentes/MBVGheader :: headerPrincipal}"></div>

<div class="container py-4 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary m-0">
            <i class="fas fa-star me-2"></i>Calificar Viaje
        </h2>

        <a th:href="@{/cliente/historial}" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-1"></i>Volver al Historial
        </a>
    </div>

    <div class="row">

        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm h-100 detalle-card">
                <div class="card-body">
                    <h5 class="text-success border-bottom pb-2 mb-3">
                        <i class="fas fa-info-circle me-2"></i>Detalles del viaje
                    </h5>

                    <p>
                        <strong>Reserva:</strong>
                        <span th:text="${'#' + reserva.id}"></span>
                    </p>

                    <p>
                        <strong>Origen:</strong>
                        <span th:text="${reserva.origen}"></span>
                    </p>

                    <p>
                        <strong>Destino:</strong>
                        <span th:text="${reserva.destino}"></span>
                    </p>

                    <p>
                        <strong>Conductor:</strong>
                        <span th:text="${conductor != null ? conductor.nombre : 'Conductor asignado'}"></span>
                    </p>

                    <p>
                        <strong>Vehículo:</strong>
                        <span class="badge bg-info text-dark" th:text="${reserva.tipoVehiculo}"></span>
                    </p>

                    <p>
                        <strong>Tarifa:</strong>
                        <span class="fw-bold text-success" th:text="${'S/ ' + reserva.tarifa}"></span>
                    </p>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm main-card">
                <div class="card-header bg-warning text-dark">
                    <h5 class="mb-0">
                        <i class="fas fa-edit me-2"></i>Evaluación del servicio
                    </h5>
                </div>

                <div class="card-body">
                    <form th:action="@{/cliente/calificar}" method="post" id="formCalificacion">

                        <input type="hidden" name="reservaId" th:value="${reserva.id}">
                        <input type="hidden" name="conductorId" th:value="${reserva.conductorId}">

                        <div class="rating-section text-center">
                            <h5 class="text-primary">Calificación General</h5>

                            <div class="star-rating" id="ratingGeneral">
                                <span class="star" data-value="1"><i class="far fa-star"></i></span>
                                <span class="star" data-value="2"><i class="far fa-star"></i></span>
                                <span class="star" data-value="3"><i class="far fa-star"></i></span>
                                <span class="star" data-value="4"><i class="far fa-star"></i></span>
                                <span class="star" data-value="5"><i class="far fa-star"></i></span>
                            </div>

                            <input type="hidden" name="puntuacionGeneral" id="puntuacionGeneral" value="0">

                            <small class="text-muted d-block mt-2" id="ratingText">
                                Selecciona una calificación
                            </small>
                        </div>

                        <div class="rating-section">
                            <h5 class="text-primary mb-3">Evaluación detallada</h5>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Puntualidad</label>
                                    <select name="puntuacionPuntualidad" class="form-select" required>
                                        <option value="5">5 - Excelente</option>
                                        <option value="4">4 - Muy bueno</option>
                                        <option value="3">3 - Bueno</option>
                                        <option value="2">2 - Regular</option>
                                        <option value="1">1 - Malo</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Conducción</label>
                                    <select name="puntuacionConduccion" class="form-select" required>
                                        <option value="5">5 - Excelente</option>
                                        <option value="4">4 - Muy bueno</option>
                                        <option value="3">3 - Bueno</option>
                                        <option value="2">2 - Regular</option>
                                        <option value="1">1 - Malo</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Vehículo</label>
                                    <select name="puntuacionVehiculo" class="form-select" required>
                                        <option value="5">5 - Excelente</option>
                                        <option value="4">4 - Muy bueno</option>
                                        <option value="3">3 - Bueno</option>
                                        <option value="2">2 - Regular</option>
                                        <option value="1">1 - Malo</option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Trato del conductor</label>
                                    <select name="puntuacionTrato" class="form-select" required>
                                        <option value="5">5 - Excelente</option>
                                        <option value="4">4 - Muy bueno</option>
                                        <option value="3">3 - Bueno</option>
                                        <option value="2">2 - Regular</option>
                                        <option value="1">1 - Malo</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="rating-section">
                            <h5 class="text-primary mb-3">Comentario adicional</h5>
                            <textarea class="form-control" name="comentario" rows="3" placeholder="Comparte tu experiencia con el servicio..."></textarea>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-calificar">
                                <i class="fas fa-paper-plane me-2"></i>Enviar Calificación
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{MBVGComponentes/MBVGfooter :: footerPrincipal}"></div>

<script>
    const stars = document.querySelectorAll('#ratingGeneral .star');
    const hiddenInput = document.getElementById('puntuacionGeneral');
    const ratingText = document.getElementById('ratingText');
    const form = document.getElementById('formCalificacion');

    const textos = {
        1: 'Malo',
        2: 'Regular',
        3: 'Bueno',
        4: 'Muy bueno',
        5: 'Excelente'
    };

    stars.forEach(star => {
        star.addEventListener('click', function () {
            const valor = parseInt(this.getAttribute('data-value'));
            hiddenInput.value = valor;

            stars.forEach((s, index) => {
                if (index < valor) {
                    s.innerHTML = '<i class="fas fa-star"></i>';
                    s.classList.add('active');
                } else {
                    s.innerHTML = '<i class="far fa-star"></i>';
                    s.classList.remove('active');
                }
            });

            ratingText.textContent = textos[valor];
        });
    });

    form.addEventListener('submit', function (e) {
        if (parseInt(hiddenInput.value) < 1) {
            e.preventDefault();
            alert('Debes seleccionar una calificación general.');
        }
    });
</script>

</body>
</html>
