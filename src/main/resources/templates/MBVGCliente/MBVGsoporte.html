<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Soporte al Cliente - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{MBVGComponentes/MBVGheader :: headerPrincipal}"></div>

    <div class="container py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary m-0"><i class="fas fa-headset me-2"></i>Soporte Técnico</h2>
            <div>
                <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#modalNuevoTicket">
                    <i class="fas fa-plus me-1"></i>Nuevo Ticket
                </button>
                <a th:href="@{/cliente/dashboard}" class="btn btn-outline-secondary">Volver</a>
            </div>
        </div>

        <div th:if="${session.mensajeExito != null}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i><span th:text="${session.mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0"><i class="fas fa-list me-2"></i>Mis Tickets de Soporte</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Ticket ID</th>
                                <th>Asunto</th>
                                <th>Prioridad</th>
                                <th>Estado</th>
                                <th>Fecha</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="ticket : ${tickets}">
                                <td th:text="${'#' + ticket.id}"></td>
                                <td th:text="${ticket.asunto}"></td>
                                <td><span class="badge bg-info" th:text="${ticket.prioridad}"></span></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${ticket.estado == 'abierto' ? 'bg-warning text-dark' : (ticket.estado == 'resuelto' ? 'bg-success' : 'bg-secondary')}"
                                          th:text="${ticket.estado}">
                                    </span>
                                </td>
                                <td th:text="${ticket.fechaCreacion != null ? #dates.format(ticket.fechaCreacion, 'dd/MM/yyyy HH:mm') : 'Reciente'}"></td>
                                <td>
                                    <a th:href="@{/cliente/soporte/detalle(id=${ticket.id})}" class="btn btn-sm btn-outline-primary">Ver Detalle</a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tickets)}">
                                <td colspan="6" class="text-center py-4 text-muted">Aún no has creado ningún ticket de soporte.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuevoTicket" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-plus-circle me-2"></i>Crear Ticket</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/cliente/soporte/crear}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Asunto</label>
                            <input type="text" class="form-control" name="asunto" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Prioridad</label>
                            <select class="form-select" name="prioridad" required>
                                <option value="baja">Baja</option>
                                <option value="media">Media</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="4" required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Enviar Ticket</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{MBVGComponentes/MBVGfooter :: footerPrincipal}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
