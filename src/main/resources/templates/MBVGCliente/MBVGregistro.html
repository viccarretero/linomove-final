<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Cliente - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .register-bg {
            background: linear-gradient(rgba(26, 26, 46, 0.92), rgba(22, 33, 62, 0.92)), 
                        url('https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=1920&q=80') center/cover no-repeat fixed;
            min-height: 100vh; display: flex; align-items: center; padding: 60px 0;
        }
        .register-card { background: white; border-radius: 25px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
        .register-header { background: linear-gradient(135deg, #4a9eff 0%, #2d7dd2 100%); padding: 40px; text-align: center; color: white; }
        .btn-register { background: linear-gradient(135deg, #4a9eff 0%, #2d7dd2 100%); border: none; padding: 15px 40px; border-radius: 50px; font-weight: 700; color: white; }
    </style>
</head>
<body class="register-bg">
    <div class="container register-container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card register-card">
                    <div class="register-header">
                        <h3>Crear Cuenta</h3>
                        <p>Únete a Linomove y disfruta de nuestros servicios</p>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/registro}" th:object="${cliente}" method="post" id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-user text-primary me-1"></i>Nombre Completo</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-id-card text-primary me-1"></i>Documento</label>
                                    <input type="text" class="form-control" th:field="*{documentoIdentidad}">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope text-primary me-1"></i>Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock text-primary me-1"></i>Contraseña</label>
                                <input type="password" class="form-control" th:field="*{password}" required minlength="6">
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-phone text-primary me-1"></i>Teléfono</label>
                                    <input type="tel" class="form-control" th:field="*{telefono}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-map-marker-alt text-primary me-1"></i>Dirección</label>
                                    <input type="text" class="form-control" th:field="*{direccion}">
                                </div>
                            </div>
                            
                            <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
                                <span>Ocurrió un error al registrar.</span>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-register"><i class="fas fa-user-plus me-2"></i>Crear Cuenta</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted">¿Ya tienes cuenta? <a th:href="@{/login-cliente}" class="text-primary text-decoration-none fw-bold">Inicia sesión aquí</a></p>
                            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm mt-2"><i class="fas fa-arrow-left me-1"></i>Volver al Inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
