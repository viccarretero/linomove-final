<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Ticket - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div th:replace="~{MBVGComponentes/MBVGheader :: headerPrincipal}"></div>

    <div class="container py-4 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-primary m-0"><i class="fas fa-ticket-alt me-2"></i>Ticket <span th:text="${'#' + ticket.id}"></span></h2>
            <a th:href="@{/cliente/soporte}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Volver</a>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="m-0" th:text="${ticket.asunto}"></h5>
                        <span class="badge" th:classappend="${ticket.estado == 'abierto' ? 'bg-warning text-dark' : 'bg-success'}" th:text="${ticket.estado}"></span>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small mb-2"><i class="fas fa-calendar me-1"></i> Creado el: <span th:text="${#dates.format(ticket.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span></p>
                        <div class="bg-light p-3 rounded mb-0">
                            <p class="mb-0" th:text="${ticket.descripcion}"></p>
                        </div>
                    </div>
                </div>

                <div th:if="${ticket.respuesta != null}" class="card shadow-sm border-0 border-start border-success border-4">
                    <div class="card-header bg-white py-3">
                        <h6 class="text-success m-0"><i class="fas fa-reply me-2"></i>Respuesta de Linomove</h6>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small mb-2"><i class="fas fa-clock me-1"></i> Respondido el: <span th:text="${#dates.format(ticket.fechaResolucion, 'dd/MM/yyyy HH:mm')}"></span></p>
                        <p class="mb-0" th:text="${ticket.respuesta}"></p>
                    </div>
                </div>
                
                <div th:if="${ticket.respuesta == null}" class="alert alert-info text-center mt-3">
                    <i class="fas fa-hourglass-half me-2"></i>Tu ticket está siendo revisado por nuestro equipo. Te notificaremos pronto.
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{MBVGComponentes/MBVGfooter :: footerPrincipal}"></div>
</body>
</html>
