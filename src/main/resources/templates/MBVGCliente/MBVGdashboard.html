<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Cliente - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .cliente-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .dashboard-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .notificacion-item {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
            border-left: 4px solid #f59e0b;
            margin-bottom: 10px;
        }

        .notificacion-item h6 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .notificacion-item p {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .notif-badge {
            font-size: 11px;
        }
    </style>
</head>

<body class="cliente-bg d-flex flex-column">

    <div th:replace="~{MBVGComponentes/MBVGheader :: headerPrincipal}"></div>

    <div class="container mt-4 flex-grow-1">
        
        <div th:if="${session.mensajeExito != null}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${session.mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${session.mensajeError != null}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${session.mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="dashboard-card p-4 h-100">
                    <h5 class="text-primary border-bottom pb-2 mb-3">
                        <i class="fas fa-car me-2"></i>Solicitar Traslado
                    </h5>

                    <form th:action="@{/cliente/solicitar-traslado}" th:object="${reserva}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Origen <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{origen}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Destino <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{destino}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Fecha y Hora <span class="text-danger">*</span></label>
                            <input type="datetime-local" class="form-control" th:field="*{fechaTraslado}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo de Vehículo <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{tipoVehiculo}" required>
                                <option value="economico">Económico</option>
                                <option value="comfort">Confort</option>
                                <option value="premium">Premium</option>
                                <option value="suv">SUV</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Observaciones</label>
                            <textarea class="form-control" th:field="*{observaciones}" rows="2"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-paper-plane me-2"></i>Solicitar Traslado
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-6 mb-4">
                <div class="dashboard-card p-4 mb-4">
                    <h5 class="text-success border-bottom pb-2 mb-3">
                        <i class="fas fa-concierge-bell me-2"></i>Servicios
                    </h5>

                    <div class="d-grid gap-3">
                        <a th:href="@{/cliente/rastreo}" class="btn btn-outline-info p-3 text-start">
                            <i class="fas fa-map-marker-alt me-3"></i>Rastrear Viaje Activo
                        </a>

                        <a th:href="@{/cliente/historial}" class="btn btn-outline-warning p-3 text-start">
                            <i class="fas fa-history me-3"></i>Mi Historial
                        </a>

                        <a th:href="@{/cliente/soporte}" class="btn btn-outline-danger p-3 text-start">
                            <i class="fas fa-headset me-3"></i>Soporte Técnico
                        </a>

                        <a th:href="@{/cliente/notificaciones}" class="btn btn-outline-primary p-3 text-start">
                            <i class="fas fa-bell me-3"></i>
                            Ver Notificaciones
                            <span th:if="${totalNoLeidas > 0}"
                                  class="badge bg-danger ms-2"
                                  th:text="${totalNoLeidas}">
                            </span>
                        </a>
                    </div>
                </div>

                <div class="dashboard-card p-4">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="text-warning mb-0">
                            <i class="fas fa-bell me-2"></i>Notificaciones Recientes
                        </h5>

                        <a th:href="@{/cliente/notificaciones}" class="btn btn-sm btn-outline-warning">
                            Ver todas
                        </a>
                    </div>

                    <div th:if="${#lists.isEmpty(notificacionesRecientes)}" class="text-center py-3 text-muted">
                        <i class="fas fa-bell-slash fa-2x mb-2"></i>
                        <p class="mb-0">No hay notificaciones nuevas</p>
                    </div>

                    <div th:each="notif : ${notificacionesRecientes}" class="notificacion-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <h6 class="fw-bold" th:text="${notif.titulo}"></h6>

                            <span th:if="${notif.estado == 'enviada'}" class="badge bg-warning text-dark notif-badge">
                                NUEVO
                            </span>
                        </div>

                        <p class="text-muted" th:text="${notif.mensaje}"></p>

                        <small class="text-secondary">
                            <i class="fas fa-clock me-1"></i>
                            <span th:text="${#dates.format(notif.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{MBVGComponentes/MBVGfooter :: footerPrincipal}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
