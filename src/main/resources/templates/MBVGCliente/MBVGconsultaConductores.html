<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Conductores Disponibles - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px 0; }
        .conductor-card { background: white; border-radius: 15px; border: none; transition: all 0.3s ease; }
        .conductor-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h4 class="m-0"><i class="fas fa-car-side me-2"></i>Conductores Disponibles</h4>
                        <span class="badge bg-light text-dark"><i class="fas fa-users me-1"></i> <span th:text="${#lists.size(conductoresDisponibles)}"></span></span>
                    </div>
                    <div class="card-body bg-light">
                        
                        <div class="alert alert-info mb-4">
                            <i class="fas fa-info-circle me-2"></i><strong>Vehículo consultado:</strong> 
                            <span class="badge bg-primary ms-2" th:text="${tipoVehiculo}"></span>
                        </div>

                        <div th:if="${#lists.isEmpty(conductoresDisponibles)}" class="text-center py-5">
                            <i class="fas fa-car fa-4x text-muted mb-3"></i>
                            <h4 class="text-muted">No hay conductores disponibles</h4>
                            <p class="text-muted mb-4">Intenta con otro tipo de vehículo o en otro horario.</p>
                        </div>

                        <div class="row g-4" th:if="${not #lists.isEmpty(conductoresDisponibles)}">
                            <div class="col-md-6" th:each="cond : ${conductoresDisponibles}">
                                <div class="card conductor-card h-100 text-center p-3">
                                    <div class="mb-3">
                                        <img th:src="@{'https://ui-avatars.com/api/?name=' + ${cond.nombre} + '&background=667eea&color=fff&size=128'}" class="rounded-circle" width="80">
                                    </div>
                                    <h5 th:text="${cond.nombre}"></h5>
                                    <p class="text-muted small mb-2"><i class="fas fa-car me-1"></i><span th:text="${cond.vehiculoAsignado}"></span></p>
                                    <div class="text-warning mb-2">
                                        <i class="fas fa-star"></i> <span th:text="${cond.puntuacionPromedio}"></span>
                                    </div>
                                    <span class="badge bg-success"><i class="fas fa-circle me-1"></i>Disponible</span>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-4 pt-3 border-top">
                            <a th:href="@{/cliente/dashboard}" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-2"></i>Volver al Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
