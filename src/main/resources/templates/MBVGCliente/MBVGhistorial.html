<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Historial - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .acciones-viaje {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }

        .badge {
            font-size: 0.78rem;
        }
    </style>
</head>

<body style="background-color: #f8f9fa;" class="d-flex flex-column min-vh-100">

    <div th:replace="~{MBVGComponentes/MBVGheader :: headerPrincipal}"></div>

    <div class="container mt-4 flex-grow-1">
        
        <div th:if="${session.mensajeExito != null}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${session.mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${session.mensajeError != null}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${session.mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="text-primary m-0">
                <i class="fas fa-history me-2"></i>Mi Historial de Viajes
            </h3>

            <a th:href="@{/cliente/dashboard}" class="btn btn-outline-primary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Volver
            </a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">

                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha Solicitada</th>
                                <th>Ruta</th>
                                <th>Conductor</th>
                                <th>Tarifa</th>
                                <th>Estado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="viaje : ${historialViajes}">
                                
                                <td th:text="${viaje.fechaTraslado != null ? viaje.fechaTraslado : 'Pendiente'}"></td>
                                
                                <td>
                                    <strong class="text-danger">
                                        <i class="fas fa-map-marker-alt me-1"></i>
                                        Origen: <span th:text="${viaje.origen}"></span>
                                    </strong>
                                    <br>
                                    <strong class="text-success">
                                        <i class="fas fa-flag-checkered me-1"></i>
                                        Destino: <span th:text="${viaje.destino}"></span>
                                    </strong>
                                </td>
                                
                                <td th:text="${viaje.conductorId != null ? 'ID Conductor: ' + viaje.conductorId : 'Por asignar'}"></td>
                                
                                <td class="text-success fw-bold"
                                    th:text="${viaje.tarifa != null ? 'S/ ' + viaje.tarifa : 'Calculando...'}">
                                </td>
                                
                                <td>
                                    <span class="badge"
                                          th:classappend="${
                                            viaje.estado == 'pendiente' ? 'bg-warning text-dark' :
                                            (viaje.estado == 'asignada' ? 'bg-info text-dark' :
                                            (viaje.estado == 'en_ruta' ? 'bg-primary' :
                                            ((viaje.estado == 'completada' or viaje.estado == 'completado') ? 'bg-success' : 'bg-secondary')))
                                          }"
                                          th:text="${viaje.estado}">
                                    </span>
                                </td>
                                
                                <td th:with="estadoPago=${pagosPorReserva[viaje.id]},
                                             yaCalificado=${calificacionesPorReserva[viaje.id]},
                                             viajeCompletado=${viaje.estado == 'completada' or viaje.estado == 'completado'}">

                                    <div class="acciones-viaje">

                                        <a th:if="${viajeCompletado and (estadoPago == null or estadoPago == 'pendiente' or estadoPago == 'rechazado')}"
                                           th:href="@{/cliente/pago(reservaId=${viaje.id})}"
                                           class="btn btn-sm btn-success">
                                            <i class="fas fa-money-bill-wave me-1"></i>Pagar
                                        </a>

                                        <span th:if="${viajeCompletado and estadoPago == 'pendiente_validacion'}"
                                              class="badge bg-warning text-dark">
                                            <i class="fas fa-clock me-1"></i>Pago en validación
                                        </span>

                                        <span th:if="${viajeCompletado and estadoPago == 'completado'}"
                                              class="badge bg-success">
                                            <i class="fas fa-check-circle me-1"></i>Pagado
                                        </span>

                                        <a th:if="${viajeCompletado and viaje.conductorId != null and yaCalificado != true}"
                                           th:href="@{/cliente/calificar(reservaId=${viaje.id})}"
                                           class="btn btn-sm btn-warning text-dark">
                                            <i class="fas fa-star me-1"></i>Calificar
                                        </a>

                                        <span th:if="${viajeCompletado and yaCalificado == true}"
                                              class="badge bg-primary">
                                            <i class="fas fa-check me-1"></i>Calificado
                                        </span>

                                        <span th:if="${viaje.estado == 'pendiente'}" class="text-muted">
                                            <i class="fas fa-hourglass-half me-1"></i>En espera
                                        </span>

                                        <span th:if="${viaje.estado == 'asignada'}" class="text-info">
                                            <i class="fas fa-user-check me-1"></i>Asignado
                                        </span>

                                        <span th:if="${viaje.estado == 'en_ruta'}" class="text-primary">
                                            <i class="fas fa-route me-1"></i>En ruta
                                        </span>

                                    </div>

                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(historialViajes)}">
                                <td colspan="6" class="text-center py-4 text-muted">
                                    Aún no tienes viajes registrados.
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{MBVGComponentes/MBVGfooter :: footerPrincipal}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
