<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://www.google.com/recaptcha/enterprise.js" async defer></script>

    <style>
        .admin-login-bg {
            background: linear-gradient(135deg, #2c3e50 0%, #e74c3c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
            height: 100px;
        }

        .admin-icon {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -40px auto 20px;
            border: 4px solid white;
        }

        .btn-admin {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body class="admin-login-bg">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="card-header-custom"></div>

                <div class="card-body px-5 pb-5">
                    <div class="admin-icon">
                        <i class="fas fa-user-shield text-white fa-2x"></i>
                    </div>

                    <h3 class="text-center mb-4" style="color: #c0392b;">
                        Panel de Administración
                    </h3>

                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        Credenciales inválidas. Intente nuevamente.
                    </div>

                    <div th:if="${param.captcha}" class="alert alert-warning text-center">
                        Debes completar la verificación reCAPTCHA.
                    </div>

                    <form th:action="@{/procesar-login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-envelope me-2"></i>Email Admin
                            </label>
                            <input type="email" class="form-control" name="username" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                <i class="fas fa-lock me-2"></i>Contraseña
                            </label>
                            <input type="password" class="form-control" name="password" required>
                        </div>

                        <input type="hidden" name="tipoUsuario" value="admin">

                        <div class="d-flex justify-content-center mb-3 mt-3">
                            <div class="g-recaptcha"
                                 th:attr="data-sitekey=${recaptchaSiteKey}"
                                 data-action="LOGIN">
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-admin">
                                <i class="fas fa-sign-in-alt me-2"></i>Ingresar
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <a th:href="@{/}" class="text-muted text-decoration-none">
                                <i class="fas fa-arrow-left me-1"></i>Volver al inicio
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
