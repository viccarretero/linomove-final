<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Asignación de Traslados - Linomove</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .reserva-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #fff;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .reserva-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 4px 14px rgba(13,110,253,0.12);
        }

        #map {
            width: 100%;
            height: 330px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            background: #f8f9fa;
        }

        .route-placeholder {
            height: 330px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #6c757d;
            background: #f8f9fa;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e9ecef;
        }

        .badge-req {
            background: #6c757d;
        }
    </style>
</head>
<body>

<div th:replace="~{MBVGComponentes/MBVGmenu :: menuAdmin}"></div>

<div class="main-content">

    <div class="top-navbar mb-4">
        <h4 class="mb-0 text-dark fw-bold">
            <i class="fas fa-tasks me-2 text-primary"></i>Asignación de Traslados Pendientes
        </h4>
        <div class="text-muted">
            <i class="fas fa-calendar-alt me-2"></i>
            <span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}"></span>
        </div>
    </div>

    <div class="p-4">

        <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${param.exito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${param.error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">

            <!-- LISTA DE RESERVAS -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold text-warning">
                        <i class="fas fa-clock me-2"></i>Reservas Pendientes
                    </div>

                    <div class="card-body">

                        <div th:if="${#lists.isEmpty(reservasPendientes)}" class="text-center text-muted py-5">
                            <i class="fas fa-clipboard-check fa-3x mb-3"></i>
                            <h5>No hay reservas pendientes</h5>
                            <p>Cuando un cliente solicite un traslado, aparecerá aquí.</p>
                        </div>

                        <div class="reserva-card" th:each="reserva : ${reservasPendientes}">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6 class="fw-bold mb-2">
                                        Reserva #<span th:text="${reserva.id}"></span>
                                    </h6>

                                    <div class="mb-1">
                                        <i class="fas fa-map-marker-alt text-danger me-2"></i>
                                        <strong th:text="${reserva.origen}"></strong>
                                    </div>

                                    <div class="mb-2">
                                        <i class="fas fa-flag-checkered text-success me-2"></i>
                                        <strong th:text="${reserva.destino}"></strong>
                                    </div>

                                    <span class="badge badge-req">
                                        <i class="fas fa-car me-1"></i>
                                        Req:
                                        <span th:text="${reserva.tipoVehiculo}"></span>
                                    </span>
                                </div>

                                <div class="text-end">
                                    <small class="text-muted d-block mb-4"
                                           th:text="${reserva.fechaTraslado != null ? #dates.format(reserva.fechaTraslado, 'yyyy-MM-dd HH:mm') : 'Sin fecha'}">
                                    </small>

                                    <button type="button"
                                            class="btn btn-primary btn-sm btn-atender"
                                            th:data-id="${reserva.id}"
                                            th:data-origen="${reserva.origen}"
                                            th:data-destino="${reserva.destino}"
                                            th:data-tipo="${reserva.tipoVehiculo}"
                                            th:data-label="${'Reserva #' + reserva.id + ' (' + reserva.origen + ' a ' + reserva.destino + ')'}">
                                        Atender
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- CONFIGURACIÓN DE RUTA Y CONDUCTOR -->
            <div class="col-lg-6 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold">
                        <i class="fas fa-route me-2"></i>Configuración de Ruta y Conductor
                    </div>

                    <div class="card-body">

                        <div id="map"></div>

                        <form id="formAsignacion" th:action="@{/admin/asignar}" method="post" class="mt-4">

                            <input type="hidden" id="reservaId" name="reservaId">

                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted">RESERVA SELECCIONADA:</label>
                                <input type="text" id="reservaSeleccionada" class="form-control" value="Seleccione una reserva" readonly>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Origen</label>
                                    <input type="text" id="origenMapa" class="form-control" placeholder="Origen">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Destino</label>
                                    <input type="text" id="destinoMapa" class="form-control" placeholder="Destino">
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="button" class="btn btn-outline-primary" onclick="calcularRutaDesdeInputs()">
                                    <i class="fas fa-route me-2"></i>Calcular ruta con Google Maps
                                </button>
                            </div>

                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Distancia Estimada (Km)</label>
                                    <input type="number"
                                           step="0.01"
                                           min="0.1"
                                           class="form-control"
                                           id="distanciaMapeada"
                                           name="distanciaMapeada"
                                           required>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Tiempo Estimado</label>
                                    <input type="text" class="form-control" id="tiempoEstimado" readonly>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Tarifa Estimada</label>
                                    <input type="text" class="form-control" id="tarifaEstimada" readonly>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Seleccionar Conductor Disponible</label>
                                <select class="form-select" id="conductorId" name="conductorId" required>
                                    <option value="">Seleccione conductor</option>
                                    <option th:each="conductor : ${conductoresDisponibles}"
                                            th:value="${conductor.id}"
                                            th:text="${conductor.nombre + ' (' + conductor.tipoVehiculo + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div th:if="${#lists.isEmpty(conductoresDisponibles)}" class="alert alert-warning">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                No hay conductores disponibles actualmente.
                            </div>

                            <div class="d-grid">
                                <button type="submit"
                                        class="btn btn-success fw-bold"
                                        th:disabled="${#lists.isEmpty(conductoresDisponibles)}">
                                    <i class="fas fa-check-circle me-2"></i>Confirmar Asignación
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>

        </div>

    </div>
</div>

<script th:inline="javascript">
    let map;
    let directionsService;
    let directionsRenderer;
    let origenAutocomplete;
    let destinoAutocomplete;

    const tarifaKm = Number(/*[[${tarifaKm}]]*/ 3.10);

    window.initMap = function () {
        const tacna = { lat: -18.0056, lng: -70.2461 };

        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 7,
            center: tacna
        });

        directionsService = new google.maps.DirectionsService();

        directionsRenderer = new google.maps.DirectionsRenderer({
            map: map,
            suppressMarkers: false
        });

        origenAutocomplete = new google.maps.places.Autocomplete(
            document.getElementById("origenMapa"),
            {
                componentRestrictions: { country: "pe" },
                fields: ["formatted_address", "geometry", "name"]
            }
        );

        destinoAutocomplete = new google.maps.places.Autocomplete(
            document.getElementById("destinoMapa"),
            {
                componentRestrictions: { country: "pe" },
                fields: ["formatted_address", "geometry", "name"]
            }
        );
    };

    document.addEventListener("DOMContentLoaded", function () {
        const botones = document.querySelectorAll(".btn-atender");

        botones.forEach(function (boton) {
            boton.addEventListener("click", function () {
                seleccionarReserva(this);
            });
        });

        const form = document.getElementById("formAsignacion");

        form.addEventListener("submit", function (event) {
            const reservaId = document.getElementById("reservaId").value;
            const conductorId = document.getElementById("conductorId").value;
            const distancia = Number(document.getElementById("distanciaMapeada").value);

            if (!reservaId) {
                event.preventDefault();
                alert("Primero selecciona una reserva pendiente.");
                return;
            }

            if (!conductorId) {
                event.preventDefault();
                alert("Selecciona un conductor disponible.");
                return;
            }

            if (!distancia || distancia <= 0) {
                event.preventDefault();
                alert("Calcula o ingresa una distancia válida.");
            }
        });
    });

    function seleccionarReserva(boton) {
        const reservaId = boton.getAttribute("data-id");
        const origen = boton.getAttribute("data-origen");
        const destino = boton.getAttribute("data-destino");
        const label = boton.getAttribute("data-label");

        document.getElementById("reservaId").value = reservaId;
        document.getElementById("reservaSeleccionada").value = label;
        document.getElementById("origenMapa").value = origen;
        document.getElementById("destinoMapa").value = destino;

        limpiarCalculos();
        calcularRuta(origen, destino);
    }

    function calcularRutaDesdeInputs() {
        const origen = document.getElementById("origenMapa").value;
        const destino = document.getElementById("destinoMapa").value;

        if (!origen || !destino) {
            alert("Debe ingresar origen y destino.");
            return;
        }

        calcularRuta(origen, destino);
    }

    function calcularRuta(origen, destino) {
        if (!directionsService || !directionsRenderer) {
            alert("Google Maps todavía está cargando. Intenta nuevamente en unos segundos.");
            return;
        }

        limpiarCalculos();

        const origenFinal = completarDireccion(origen);
        const destinoFinal = completarDireccion(destino);

        directionsService.route(
            {
                origin: origenFinal,
                destination: destinoFinal,
                travelMode: google.maps.TravelMode.DRIVING,
                region: "PE"
            },
            function (response, status) {
                if (status === "OK") {
                    directionsRenderer.setDirections(response);

                    const route = response.routes[0];
                    let distanciaMetros = 0;
                    let duracionSegundos = 0;

                    route.legs.forEach(function (leg) {
                        distanciaMetros += leg.distance.value;
                        duracionSegundos += leg.duration.value;
                    });

                    const distanciaKm = distanciaMetros / 1000;
                    const distanciaRedondeada = Number(distanciaKm.toFixed(2));
                    const minutos = Math.ceil(duracionSegundos / 60);
                    const tarifa = distanciaRedondeada * tarifaKm;

                    document.getElementById("distanciaMapeada").value = distanciaRedondeada.toFixed(2);
                    document.getElementById("tiempoEstimado").value = formatearTiempo(minutos);
                    document.getElementById("tarifaEstimada").value = "S/ " + tarifa.toFixed(2);

                } else {
                    alert("No se pudo calcular la ruta con Google Maps. Estado: " + status + ". Puedes ingresar la distancia manualmente.");
                }
            }
        );
    }

    function completarDireccion(texto) {
        if (!texto) {
            return "";
        }

        const normalizado = texto.toLowerCase();

        if (normalizado.includes("perú") || normalizado.includes("peru")) {
            return texto;
        }

        return texto + ", Perú";
    }

    function formatearTiempo(minutos) {
        if (minutos < 60) {
            return minutos + " min";
        }

        const horas = Math.floor(minutos / 60);
        const resto = minutos % 60;

        if (resto === 0) {
            return horas + " h";
        }

        return horas + " h " + resto + " min";
    }

    function limpiarCalculos() {
        document.getElementById("distanciaMapeada").value = "";
        document.getElementById("tiempoEstimado").value = "";
        document.getElementById("tarifaEstimada").value = "";
    }
</script>

<script th:src="'https://maps.googleapis.com/maps/api/js?key=' + ${googleMapsApiKey} + '&libraries=places&callback=initMap'" async defer></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
