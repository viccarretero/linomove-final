<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Soporte - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #f4f6f9;">

    <div th:replace="~{MBVGComponentes/MBVGmenu :: menuAdmin}"></div>

    <div class="main-content p-4" style="margin-left: 250px;">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/admin/soporte}" class="btn btn-outline-secondary me-3"><i class="fas fa-arrow-left"></i> Volver</a>
            <h2 class="m-0"><i class="fas fa-ticket-alt me-2 text-primary"></i>Detalle de Ticket <span th:text="${'#' + ticket.id}"></span></h2>
        </div>

        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle me-2"></i>Respuesta enviada exitosamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- info del problema -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3 d-flex justify-content-between">
                        <h6 class="m-0"><i class="fas fa-comment-dots me-2"></i>Mensaje del Cliente</h6>
                        <span class="badge" th:classappend="${ticket.estado == 'abierto' ? 'bg-danger' : (ticket.estado == 'en_proceso' ? 'bg-warning text-dark' : 'bg-success')}" th:text="${ticket.estado}"></span>
                    </div>
                    <div class="card-body">
                        <h5 th:text="${ticket.asunto}"></h5>
                        <p class="text-muted small mb-3">Enviado por: <strong th:text="${ticket.nombreCliente != null ? ticket.nombreCliente : 'Cliente ' + ticket.clienteId}"></strong> el <span th:text="${#dates.format(ticket.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span></p>
                        
                        <div class="p-3 bg-light border rounded">
                            <p class="mb-0" th:text="${ticket.descripcion}"></p>
                        </div>
                    </div>
                </div>

                <!-- formulario de respuesta -->
                <div class="card shadow-sm border-0" th:if="${ticket.estado != 'resuelto'}">
                    <div class="card-header bg-white py-3">
                        <h6 class="m-0"><i class="fas fa-reply me-2"></i>Responder Ticket</h6>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/soporte/responder}" method="post">
                            <input type="hidden" name="ticketId" th:value="${ticket.id}">
                            
                            <div class="mb-3">
                                <label class="form-label">Mensaje de Respuesta al Cliente:</label>
                                <textarea class="form-control" name="respuesta" rows="5" required></textarea>
                            </div>
                            
                            <!-- TODO: compañero implementara notificacion al cliente al guardar -->
                            <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane me-2"></i>Enviar Respuesta y Cerrar Ticket</button>
                        </form>
                    </div>
                </div>

                <!-- si ya esta resuelto, mostramos la respuesta que dio el admin -->
                <div class="card shadow-sm border-0 border-success" th:if="${ticket.estado == 'resuelto'}">
                    <div class="card-body">
                        <h6 class="text-success"><i class="fas fa-check-circle me-2"></i>Resuelto por Administrador</h6>
                        <p class="text-muted mb-0" th:text="${ticket.respuesta}"></p>
                    </div>
                </div>
            </div>
            
            <!-- detalles extra -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h6 class="m-0"><i class="fas fa-info-circle me-2"></i>Información Adicional</h6>
                    </div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                Prioridad
                                <span class="badge bg-secondary" th:text="${ticket.prioridad}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                                ID Cliente
                                <span th:text="${ticket.clienteId}"></span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center px-0" th:if="${ticket.fechaResolucion != null}">
                                Fecha Resolución
                                <span th:text="${#dates.format(ticket.fechaResolucion, 'dd/MM/yyyy HH:mm')}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
