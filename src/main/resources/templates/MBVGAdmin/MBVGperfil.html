<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }</style>
</head>
<body>

    <div th:replace="~{MBVGComponentes/MBVGmenu :: menuAdmin}"></div>

    <div class="main-content">
        <div class="top-navbar mb-4">
            <h4 class="mb-0 text-dark fw-bold"><i class="fas fa-user-cog me-2 text-primary"></i>Configuración de Perfil</h4>
            <div class="text-muted"><i class="fas fa-calendar-alt me-2"></i><span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}"></span></div>
        </div>

        <div class="p-4">
            <div th:if="${param.exito}" class="alert alert-success alert-dismissible fade show shadow-sm">
                <i class="fas fa-check-circle me-2"></i><span th:text="${param.exito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show shadow-sm">
                <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${param.error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3 border-bottom-0">
                            <h6 class="mb-0 text-primary fw-bold"><i class="fas fa-id-card me-2"></i>Información Personal</h6>
                        </div>
                        <div class="card-body bg-light">
                            <form th:action="@{/admin/perfil/actualizar}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nombre Completo</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fas fa-user text-muted"></i></span>
                                        <input type="text" class="form-control" name="nombre" th:value="${admin.nombre}" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Correo Electrónico</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                                        <input type="email" class="form-control" name="email" th:value="${admin.email}" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold">Nivel de Acceso Actual</label>
                                    <input type="text" class="form-control bg-white text-muted" th:value="${admin.nivelAcceso}" disabled>
                                    <small class="text-muted"><i class="fas fa-info-circle me-1"></i>Tu nivel de acceso solo puede ser modificado por otro Super Administrador.</small>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm"><i class="fas fa-save me-2"></i>Guardar Cambios</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="card-header bg-white py-3 border-bottom-0">
                            <h6 class="mb-0 text-danger fw-bold"><i class="fas fa-shield-alt me-2"></i>Seguridad de la Cuenta</h6>
                        </div>
                        <div class="card-body bg-light">
                            <div class="alert alert-warning small py-2 mb-4 border-0 shadow-sm">
                                <i class="fas fa-lightbulb me-1"></i>Te recomendamos usar una contraseña de al menos 8 caracteres, combinando letras y números.
                            </div>
                            <form th:action="@{/admin/perfil/password}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Contraseña Actual</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                                        <input type="password" class="form-control" name="passwordActual" placeholder="Ingresa tu contraseña actual" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-bold text-success">Nueva Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white"><i class="fas fa-key text-success"></i></span>
                                        <input type="password" class="form-control" name="nuevaPassword" placeholder="Escribe tu nueva contraseña secreta" required minlength="6">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-danger w-100 fw-bold shadow-sm"><i class="fas fa-key me-2"></i>Actualizar Contraseña</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
