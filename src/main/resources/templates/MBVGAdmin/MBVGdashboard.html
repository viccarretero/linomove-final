<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Admin - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .stat-card { border-radius: 15px; border: none; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
        .bg-gradient-primary { background: linear-gradient(135deg, #4a9eff 0%, #2d7dd2 100%); color: white; }
        .bg-gradient-success { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); color: white; }
        .bg-gradient-warning { background: linear-gradient(135deg, #f1c40f 0%, #e67e22 100%); color: white; }
        .icon-shape { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div th:replace="~{MBVGComponentes/MBVGmenu :: menuAdmin}"></div>

    <div class="main-content">
        <div class="top-navbar mb-4">
            <h4 class="mb-0 text-dark fw-bold">Centro de Control Linomove</h4>
            <div class="text-muted">
                <i class="fas fa-calendar-alt me-2"></i><span th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy')}"></span>
            </div>
        </div>

        <div class="p-4">
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card stat-card bg-gradient-primary">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="mb-1 opacity-75">Total Clientes</p>
                                    <h2 class="mb-0 fw-bold" th:text="${totalClientes}">0</h2>
                                </div>
                                <div class="icon-shape">
                                    <i class="fas fa-users fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="card stat-card bg-gradient-success">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="mb-1 opacity-75">Conductores Activos</p>
                                    <h2 class="mb-0 fw-bold" th:text="${totalConductores}">0</h2>
                                </div>
                                <div class="icon-shape">
                                    <i class="fas fa-id-card fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card bg-gradient-warning">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="mb-1 opacity-75">Reservas Hoy</p>
                                    <h2 class="mb-0 fw-bold" th:text="${reservasHoy}">0</h2>
                                </div>
                                <div class="icon-shape">
                                    <i class="fas fa-calendar-day fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-3 border-bottom-0">
                    <h5 class="mb-0 text-dark fw-bold"><i class="fas fa-bell me-2 text-primary"></i>Actividad Reciente</h5>
                </div>
                <div class="card-body text-center py-5">
                    <i class="fas fa-chart-pie fa-4x text-light mb-3" style="color: #e2e8f0 !important;"></i>
                    <h5 class="text-muted fw-bold">Gestión del Sistema Activa</h5>
                    <p class="text-muted mb-0">Selecciona una opción del menú lateral izquierdo para comenzar a gestionar conductores y asignaciones.</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
