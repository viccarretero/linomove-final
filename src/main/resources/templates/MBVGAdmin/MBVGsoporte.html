<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Soporte Técnico - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background-color: #f4f6f9;">

    <div th:replace="~{MBVGComponentes/MBVGmenu :: menuAdmin}"></div>

    <div class="main-content p-4" style="margin-left: 250px;">
        <h2 class="mb-4"><i class="fas fa-headset me-2 text-primary"></i>Tickets de Soporte</h2>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Asunto</th>
                                <th>Prioridad</th>
                                <th>Estado</th>
                                <th>Fecha Creado</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- iteramos los tickets -->
                            <tr th:each="ticket : ${tickets}">
                                <td th:text="${'#' + ticket.id}"></td>
                                <td th:text="${ticket.nombreCliente != null ? ticket.nombreCliente : 'ID: ' + ticket.clienteId}"></td>
                                <td th:text="${ticket.asunto}"></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${ticket.prioridad == 'alta' ? 'bg-danger' : (ticket.prioridad == 'media' ? 'bg-warning text-dark' : 'bg-info text-dark')}"
                                          th:text="${ticket.prioridad}">
                                    </span>
                                </td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${ticket.estado == 'abierto' ? 'bg-danger' : (ticket.estado == 'en_proceso' ? 'bg-warning text-dark' : 'bg-success')}"
                                          th:text="${ticket.estado}">
                                    </span>
                                </td>
                                <td th:text="${#dates.format(ticket.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <!-- enlace al detalle del soporte -->
                                    <a th:href="@{/admin/soporte/detalle(id=${ticket.id})}" class="btn btn-sm btn-primary">
                                        Ver Detalles
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(tickets)}">
                                <td colspan="7" class="text-center py-4 text-muted">No hay tickets de soporte registrados</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
