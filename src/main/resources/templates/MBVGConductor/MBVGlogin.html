<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor Login - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://www.google.com/recaptcha/enterprise.js" async defer></script>

    <style>
        .driver-login-bg {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 50%, #d35400 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 30px 0;
        }

        .transport-decoration {
            position: absolute;
            opacity: 0.1;
            pointer-events: none;
        }

        .steering-wheel {
            top: 10%;
            left: 5%;
            font-size: 80px;
            animation: float 6s ease-in-out infinite;
        }

        .truck-icon {
            bottom: 15%;
            right: 8%;
            font-size: 60px;
            animation: float 8s ease-in-out infinite;
        }

        .road-icon {
            top: 50%;
            left: 10%;
            font-size: 70px;
            animation: float 7s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .card-header-custom {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            height: 120px;
        }

        .driver-icon {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            width: 85px;
            height: 85px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -42px auto 25px;
            border: 5px solid white;
            z-index: 5;
        }

        .btn-driver {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            color: white;
        }
    </style>
</head>

<body class="driver-login-bg">

<div class="transport-decoration steering-wheel"><i class="fas fa-steering-wheel"></i></div>
<div class="transport-decoration truck-icon"><i class="fas fa-truck"></i></div>
<div class="transport-decoration road-icon"><i class="fas fa-route"></i></div>

<div class="container">
    <div class="text-center text-white mb-4 position-relative" style="z-index: 5;">
        <h1 class="fw-bold">
            <i class="fas fa-shipping-fast me-3"></i>Linomove
        </h1>
        <p>Portal de Conductores Profesionales</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card login-card">
                <div class="card-header-custom"></div>

                <div class="card-body px-5 pb-5">
                    <div class="driver-icon">
                        <i class="fas fa-id-card-alt text-white fa-2x"></i>
                    </div>

                    <h3 class="text-center mb-1 fw-bold" style="color: #f39c12;">
                        Zona de Conductores
                    </h3>
                    <p class="text-center text-muted mb-3">
                        Panel de gestión de rutas y viajes
                    </p>

                    <div th:if="${param.error}" class="alert alert-danger text-center">
                        Credenciales inválidas o cuenta inactiva.
                    </div>

                    <div th:if="${param.captcha}" class="alert alert-warning text-center">
                        Debes completar la verificación reCAPTCHA.
                    </div>

                    <form th:action="@{/procesar-login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-envelope me-2" style="color: #f39c12;"></i>Email Corporativo
                            </label>
                            <input type="email" class="form-control" name="username" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                <i class="fas fa-lock me-2" style="color: #f39c12;"></i>Contraseña
                            </label>
                            <input type="password" class="form-control" name="password" required>
                        </div>

                        <input type="hidden" name="tipoUsuario" value="conductor">

                        <div class="d-flex justify-content-center mb-3 mt-3">
                            <div class="g-recaptcha"
                                 th:attr="data-sitekey=${recaptchaSiteKey}"
                                 data-action="LOGIN">
                            </div>
                        </div>

                        <div class="d-grid mb-3 mt-4">
                            <button type="submit" class="btn btn-driver">
                                <i class="fas fa-sign-in-alt me-2"></i>Acceder a Mi Panel
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-3 border-top pt-3">
                        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-home me-1"></i>Volver al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
