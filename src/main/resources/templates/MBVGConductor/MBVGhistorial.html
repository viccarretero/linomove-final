<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de Viajes - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .conductor-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .dashboard-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
    </style>
</head>
<body class="conductor-bg">
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="dashboard-card p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h3 class="mb-1 text-primary"><i class="fas fa-history me-2"></i>Historial de Viajes</h3>
                            <p class="text-muted mb-0">Todos tus viajes completados</p>
                        </div>
                        <a th:href="@{/conductor/dashboard}" class="btn btn-outline-primary"><i class="fas fa-arrow-left me-1"></i>Volver al Dashboard</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="dashboard-card p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Fecha</th>
                                    <th>Origen</th>
                                    <th>Destino</th>
                                    <th>Tarifa</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="reserva : ${reservasCompletadas}">
                                    <td th:text="${'#' + reserva.id}"></td>
                                    <td th:text="${#dates.format(reserva.fechaTraslado, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td th:text="${reserva.origen}"></td>
                                    <td th:text="${reserva.destino}"></td>
                                    <td class="text-success fw-bold" th:text="${'S/ ' + reserva.tarifa}"></td>
                                    <td><span class="badge bg-success">Completado</span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(reservasCompletadas)}">
                                    <td colspan="6" class="text-center py-5 text-muted">
                                        <i class="fas fa-inbox fa-3x mb-3"></i>
                                        <p>No tienes viajes completados aún.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
