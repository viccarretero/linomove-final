<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rastreo y Ubicación - Linomove</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .location-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .location-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        #map { height: 500px; border-radius: 10px; background: #e9ecef; }
    </style>
</head>
<body class="location-bg py-4">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="location-card p-4">
                    
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                        <div>
                            <h3 class="text-primary mb-1"><i class="fas fa-map-marked-alt me-2"></i>Rastreo de Viaje</h3>
                            <p class="text-muted mb-0">Sistema GPS y navegación</p>
                        </div>
                        <a th:href="@{/conductor/dashboard}" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i>Volver</a>
                    </div>

                    <div class="row">
                        <div class="col-lg-8 mb-4">
                            <div id="map" class="d-flex align-items-center justify-content-center">
                                <div class="text-center text-muted">
                                    <i class="fas fa-satellite fa-3x mb-3"></i>
                                    <p>Mapa cargando. Esperando señal GPS...</p>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-center mt-3 gap-2">
                                <button class="btn btn-primary" id="btnIrOrigen"><i class="fas fa-directions me-2"></i>Ir al Origen</button>
                                <button class="btn btn-success" id="btnIniciarTraslado"><i class="fas fa-play me-2"></i>Iniciar Traslado</button>
                                <button class="btn btn-danger" id="btnFinalizar"><i class="fas fa-stop me-2"></i>Finalizar Viaje</button>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="bg-light p-4 rounded h-100 border">
                                <h5 class="text-primary mb-3"><i class="fas fa-info-circle me-2"></i>Info del Traslado</h5>
                                
                                <div th:if="${reservaActiva != null}">
                                    <div class="mb-3 border-start border-danger border-4 ps-3">
                                        <small class="text-muted d-block">Origen</small>
                                        <strong th:text="${reservaActiva.origen}"></strong>
                                    </div>
                                    <div class="mb-3 border-start border-success border-4 ps-3">
                                        <small class="text-muted d-block">Destino</small>
                                        <strong th:text="${reservaActiva.destino}"></strong>
                                    </div>
                                    
                                    <hr>
                                    
                                    <div class="d-flex justify-content-between mb-2">
                                        <span class="text-muted">Distancia aprox:</span>
                                        <strong th:text="${reservaActiva.distanciaKm + ' km'}"></strong>
                                    </div>
                                    <div class="d-flex justify-content-between mb-4">
                                        <span class="text-muted">Tarifa a cobrar:</span>
                                        <strong class="text-success" th:text="${'S/ ' + reservaActiva.tarifa}"></strong>
                                    </div>
                                    
                                    <div class="alert alert-info py-2 small">
                                        <i class="fas fa-broadcast-tower me-1"></i> Tu ubicación se está enviando al servidor.
                                    </div>
                                </div>
                                
                                <div th:if="${reservaActiva == null}" class="text-center py-5">
                                    <i class="fas fa-truck-loading fa-3x text-muted mb-3"></i>
                                    <p class="text-muted">Sin viaje activo actualmente.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log("Modulo GPS listo para integracion de mapas");
    </script>
</body>
</html>
